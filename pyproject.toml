[project]
name = "requeststoken"
version = "1.0.0"
description = "An honest homepage for the requests community token."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "responder[orjson,server]==9.2.0",
    "httpx>=0.27,<0.29",
    "redis>=8.1,<9",
    "defusedxml>=0.7,<0.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
