services:
  web:
    image: requeststoken-org:db4f8c0
    pull_policy: never
    restart: unless-stopped
    environment:
      PORT: "5042"
      # Create requeststoken.org in https://analytics.kennethreitz.org, then set
      # UMAMI_WEBSITE_ID here. Leave UMAMI_SCRIPT_URL unset.
    expose:
      - "5042"
